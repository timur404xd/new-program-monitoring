name: Program Monitor

on:
  workflow_dispatch:  # triggered externally (e.g. cron-job.org) and manually

concurrency:
  group: program-monitor
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated state files back to the repo

jobs:
  check-programs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Alert destinations: each Discord secret that exists is used; Telegram is used while
      # both TELEGRAM_* secrets exist (delete those lines/secrets to go Discord-only).
      - name: Run Bugcrowd monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_PROGRAMS_WEBHOOK }}
          DISCORD_HEARTBEAT_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x bugcrowd_monitor.sh
          ./bugcrowd_monitor.sh

      - name: Run Intigriti monitor
        if: always()  # still run if the Bugcrowd monitor failed
        env:
          INTIGRITI_API_TOKEN: ${{ secrets.INTIGRITI_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_PROGRAMS_WEBHOOK }}
          DISCORD_HEARTBEAT_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x intigriti_monitor.sh
          ./intigriti_monitor.sh

      - name: Run Intigriti status monitor
        if: always()  # still run if an earlier monitor failed
        env:
          INTIGRITI_API_TOKEN: ${{ secrets.INTIGRITI_API_TOKEN }}
          # which programs to watch: read from the #status-watchlist channel by the bot
          # (watched_programs.txt is only used if these are not set)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATUS_WATCHLIST_CHANNEL_ID: ${{ secrets.DISCORD_STATUS_WATCHLIST_CHANNEL_ID }}
          DISCORD_OWNER_ID: ${{ secrets.DISCORD_OWNER_ID }}
          # where status changes go
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRAM_STATUS_WEBHOOK }}
          DISCORD_HEARTBEAT_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 intigriti_status_monitor.py

      - name: Commit updated state files
        if: always()  # persist state from monitors that succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update known programs state [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 5 + 1))
            done
          fi
