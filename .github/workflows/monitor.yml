name: Program Monitor

on:
  workflow_dispatch:  # triggered externally (e.g. cron-job.org) and manually

concurrency:
  group: program-monitor
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated state files back to the repo

jobs:
  check-programs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Bugcrowd monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x bugcrowd_monitor.sh
          ./bugcrowd_monitor.sh

      - name: Run Intigriti monitor
        env:
          INTIGRITI_API_TOKEN: ${{ secrets.INTIGRITI_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x intigriti_monitor.sh
          ./intigriti_monitor.sh

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update known programs state [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 5 + 1))
            done
          fi
